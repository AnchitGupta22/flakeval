[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flakeval"
version = "0.1.0"
description = "Is your LLM eval improvement real, or just noise? Repeat evals, measure variance, get a verdict."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.22"]
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Anchit Gupta" }
]
keywords = [
    "llm",
    "evaluation",
    "statistics",
    "machine-learning"
]

[project.optional-dependencies]
dev = ["pytest"]
examples = ["datasets>=2.19"]

[project.scripts]
flakeval = "flakeval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flakeval = ["templates/*"]
